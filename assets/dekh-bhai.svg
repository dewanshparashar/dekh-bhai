    <rect x="70" y="128" width="34" height="96" rx="17" transform="rotate(-32 87 176)"/>
    <rect x="113" y="60" width="36" height="150" rx="18"/>
    <rect x="152" y="44" width="36" height="166" rx="18"/>
    <rect x="191" y="56" width="36" height="154" rx="18"/>
